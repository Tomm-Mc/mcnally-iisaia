services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/charla.db
    volumes:
      - charla-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:80'
      - '5443:443' # HTTPS autofirmado, para usar el modo voz desde otro dispositivo
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  charla-data:
