server {
    listen 80;
    # HTTPS con certificado autofirmado (generado en el build de la imagen): el
    # navegador sólo habilita el micrófono en contextos seguros, y entrando desde
    # el celular por la IP de la PC no alcanza con HTTP.
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/charla.crt;
    ssl_certificate_key /etc/nginx/certs/charla.key;
    # Si llega HTTP plano al puerto HTTPS (ej. "192.168.0.53:5443" tipeado sin
    # https://), nginx da el error 497: redirigimos a la misma URL por HTTPS.
    # 5443 es el puerto publicado en docker-compose.yml.
    error_page 497 =301 https://$host:5443$request_uri;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # El default de nginx (1 MB) corta los audios del modo voz; el backend acepta hasta 10 MB.
        client_max_body_size 10m;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
